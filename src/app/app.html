<!-- Global Header / Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark-gradient mb-5 py-3 sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold fs-3 text-white" routerLink="/restaurants">
      <i class="bi bi-basket2-fill me-2 text-primary-custom"></i>QuickBite
    </a>
    <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto ps-lg-4">
        <li class="nav-item">
          <a class="nav-link text-white-50 fs-5 fw-medium custom-nav-link" routerLink="/restaurants" routerLinkActive="text-white fw-bold"><i class="bi bi-shop me-2"></i>Restaurants</a>
        </li>
        <li class="nav-item" *ngIf="isLoggedIn()">
          <a class="nav-link text-white-50 fs-5 fw-medium custom-nav-link" routerLink="/customer/orders" *ngIf="user?.role === 'CUSTOMER'" routerLinkActive="text-white fw-bold"><i class="bi bi-receipt me-2"></i>My Orders</a>
          <a class="nav-link text-white-50 fs-5 fw-medium custom-nav-link" routerLink="/owner/dashboard" *ngIf="user?.role === 'RESTAURANT_OWNER'" routerLinkActive="text-white fw-bold"><i class="bi bi-speedometer2 me-2"></i>Dashboard</a>
          <a class="nav-link text-white-50 fs-5 fw-medium custom-nav-link" routerLink="/agent/dashboard" *ngIf="user?.role === 'DELIVERY_AGENT'" routerLinkActive="text-white fw-bold"><i class="bi bi-bicycle me-2"></i>Agent Dashboard</a>
          <a class="nav-link text-white-50 fs-5 fw-medium custom-nav-link" routerLink="/admin" *ngIf="user?.role === 'ADMIN'" routerLinkActive="text-white fw-bold"><i class="bi bi-shield-lock me-2"></i>Admin Console</a>
        </li>
      </ul>
      
      <!-- Guest Links -->
      <div class="d-flex gx-3" *ngIf="!isLoggedIn()">
        <a routerLink="/login" class="btn btn-outline-light me-3 px-4 fw-bold">Sign In</a>
        <a routerLink="/register" class="btn btn-primary px-4 fw-bold shadow-sm">Sign Up</a>
      </div>
      
      <!-- Logged In Links -->
      <div class="d-flex align-items-center" *ngIf="isLoggedIn()">
        <a routerLink="/customer/cart" class="text-white position-relative me-4 d-flex align-items-center bg-white bg-opacity-10 rounded-circle justify-content-center transition-all" style="width: 45px; height: 45px; transition: all 0.2s;" title="View Cart" *ngIf="user?.role === 'CUSTOMER'" onmouseover="this.className='text-white position-relative me-4 d-flex align-items-center bg-white bg-opacity-25 rounded-circle justify-content-center'" onmouseout="this.className='text-white position-relative me-4 d-flex align-items-center bg-white bg-opacity-10 rounded-circle justify-content-center'">
          <i class="bi bi-cart3 fs-5"></i>
        </a>
        <app-notification-icon class="me-4"></app-notification-icon>
        <a routerLink="/profile" class="text-white me-4 fs-6 fw-medium text-decoration-none">
          <i class="bi bi-person-circle me-2 fs-5 text-primary-custom" style="vertical-align: middle;"></i>{{ user?.fullName || user?.email || 'Profile' }}
        </a>
        <button (click)="logout()" class="btn btn-light px-4 fw-bold text-dark rounded-pill shadow-sm py-2">
          <i class="bi bi-box-arrow-right me-2"></i>Logout
        </button>
      </div>
    </div>
  </div>
</nav>

<style>
.custom-nav-link {
  transition: all 0.2s ease;
  padding: 0.5rem 1rem !important;
  border-radius: 0.5rem;
}
.custom-nav-link:hover {
  background: rgba(255,255,255,0.1);
  color: white !important;
}
</style>

<!-- Main App Content -->
<div class="container-fluid mb-5">
  <router-outlet></router-outlet>
</div>
