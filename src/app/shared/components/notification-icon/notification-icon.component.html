<div class="position-relative notification-dropdown-wrapper d-inline-block">
  <button (click)="toggleDropdown()" class="btn text-white position-relative bg-white bg-opacity-10 rounded-circle d-flex align-items-center justify-content-center transition-all p-0 shadow-sm border-0" 
          style="width: 45px; height: 45px; transition: all 0.2s;" title="Notifications">
    <i class="bi bi-bell fs-5"></i>
    <span *ngIf="unreadCount > 0" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger shadow" style="font-size: 11px;">
      {{ unreadCount }}
    </span>
  </button>

  <!-- Dropdown Card -->
  <div *ngIf="showDropdown" class="dropdown-menu dropdown-menu-end show shadow-lg border-0 bg-dark-gradient border-top border-secondary p-0 mt-2 position-absolute"
       style="width: 320px; right: 0; z-index: 1050; border-radius: 12px; overflow: hidden;">
    <div class="d-flex justify-content-between align-items-center p-3 border-bottom border-secondary bg-dark bg-opacity-50">
      <h6 class="mb-0 text-white fw-bold">Notifications</h6>
      <button *ngIf="unreadCount > 0" (click)="markAllAsRead()" class="btn btn-link text-white-50 btn-sm text-decoration-none p-0 fw-semibold" style="font-size: 13px;">
        <i class="bi bi-check-all me-1"></i>Mark all read
      </button>
    </div>

    <div class="notification-list overflow-auto" style="max-height: 350px;">
      <!-- No Notifications -->
      <div *ngIf="notifications.length === 0" class="p-4 text-center text-white-50">
        <i class="bi bi-bell-slash fs-3 d-block mb-2"></i>
        No notifications yet
      </div>

      <!-- Notifications -->
      <div *ngFor="let item of notifications" 
           [class.bg-white]="!item.isRead" [class.bg-opacity-10]="!item.isRead"
           [class.text-white]="!item.isRead" [class.text-white-50]="item.isRead"
           (click)="onNotificationClick(item)"
           class="p-3 border-bottom border-secondary border-opacity-25 notification-item d-flex gap-3 align-items-start cursor-pointer transition-all">
        
        <div class="notification-icon rounded-circle bg-primary bg-opacity-25 p-2 text-primary-custom flex-shrink-0 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
          <i class="bi bi-info-circle fs-6"></i>
        </div>
        
        <div class="flex-grow-1 min-width-0">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="fw-bold" style="font-size: 14px;">{{ item.title }}</span>
            <span class="text-white-50" style="font-size: 11px;">{{ item.sentAt | date:'shortTime' }}</span>
          </div>
          <p class="mb-0 text-truncate text-wrap" style="font-size: 13px; line-height: 1.4;">
            {{ item.message }}
          </p>
        </div>
      </div>
    </div>

    <div class="p-2 border-top border-secondary text-center bg-dark bg-opacity-25">
      <a routerLink="/notifications" (click)="showDropdown = false" class="btn btn-link text-primary-custom btn-sm text-decoration-none fw-bold w-100">
        See All Notifications
      </a>
    </div>
  </div>
</div>
