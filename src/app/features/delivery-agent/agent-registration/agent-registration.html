<div class="container my-5 fade-in">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      
      <div class="text-center mb-5">
         <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-4" style="width: 100px; height: 100px;">
           <i class="bi bi-bicycle display-4"></i>
         </div>
         <h2 class="display-5 fw-bold">Join the Fleet</h2>
         <p class="text-muted">Register your details to start delivering with QuickBite</p>
      </div>

      <div class="card border-0 shadow-lg rounded-5 overflow-hidden">
        <div class="card-body p-4 p-md-5">
          <form [formGroup]="registrationForm" (ngSubmit)="onSubmit()">
            
            <div *ngIf="errorMessage" class="alert alert-danger rounded-4 mb-4">
              {{ errorMessage }}
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">Full Name</label>
              <input type="text" formControlName="fullName" class="form-control rounded-4 p-3 border-light bg-light" placeholder="Enter your full name">
            </div>

            <div class="mb-4">
              <label class="form-label fw-bold">Phone Number</label>
              <input type="text" formControlName="phone" class="form-control rounded-4 p-3 border-light bg-light" placeholder="10-digit mobile number">
              <div *ngIf="registrationForm.get('phone')?.touched && registrationForm.get('phone')?.errors?.['pattern']" class="text-danger small mt-1">
                 Please enter a valid 10-digit number.
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                 <label class="form-label fw-bold">Vehicle Type</label>
                 <select formControlName="vehicleType" class="form-select rounded-4 p-3 border-light bg-light">
                   <option value="Bicycle">Bicycle</option>
                   <option value="Bike">Motorbike</option>
                   <option value="Car">Car</option>
                   <option value="Scooter">Scooter</option>
                 </select>
              </div>
              <div class="col-md-6">
                 <label class="form-label fw-bold">Vehicle Number</label>
                 <input type="text" formControlName="vehicleNumber" class="form-control rounded-4 p-3 border-light bg-light" placeholder="e.g. MP04-QB-1234">
              </div>
            </div>

            <button type="submit" [disabled]="registrationForm.invalid || loading" class="btn btn-primary w-100 rounded-pill py-3 fw-bold shadow-lg mt-4">
              <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
              {{ loading ? 'Processing...' : 'Complete Registration' }}
            </button>

            <p class="text-center text-muted small mt-4">
               By registering, you agree to QuickBite's delivery partner terms and conditions.
            </p>
          </form>
        </div>
      </div>

    </div>
  </div>
</div>
