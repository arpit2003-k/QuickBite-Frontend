<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QuickBite | Premium Food Delivery</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Add Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Razorpay Checkout Script -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body class="bg-light">
  <script>
    window.addEventListener('error', function(e) {
      document.body.innerHTML += '<div style="color:red; background:white; padding:20px; z-index:9999; position:absolute; top:0; left:0; width:100%; font-family:monospace; font-size:16px;"><strong>Angular Runtime Error:</strong><br>' + e.error.stack.replace(/\n/g, '<br>') + '</div>';
    });
    window.addEventListener('unhandledrejection', function(e) {
      document.body.innerHTML += '<div style="color:red; background:white; padding:20px; z-index:9999; position:absolute; top:0; left:0; width:100%; font-family:monospace; font-size:16px;"><strong>Unhandled Promise Rejection:</strong><br>' + e.reason + '</div>';
    });
  </script>
  <app-root></app-root>
</body>
</html>
